<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Booking</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header>
    <h1>BookMyShow Clone</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search for Movies...">
    </div>
  </header>

  <nav>
    <a href="#">Movies</a>
    <a id="rentBtn">Rent</a>
  </nav>

  <section class="banner">
    <h2>Now Showing</h2>
  </section>

  <section class="movies">
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
      <h3>Movie Title 1</h3>
      <p>Action | 2h 10m</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
      <h3>Movie Title 2</h3>
      <p>Drama | 1h 50m</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
      <h3>Movie Title 3</h3>
      <p>Comedy | 2h 00m</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
      <h3>Movie Title 4</h3>
      <p>Thriller | 2h 20m</p>
    </div>
  </section>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Rent Form -->
  <div class="rent-form" id="rentForm">
    <h2>Rent a Movie</h2>
    <form>
      <label for="movieName">Movie Name:</label>
      <input type="text" id="movieName" name="movieName" required>

      <label for="duration">Duration (days):</label>
      <input type="number" id="duration" name="duration" min="1" required>

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required>

      <button type="submit">Submit</button>
      <button type="button" id="closeForm">Close</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 BookMyShow Clone | All Rights Reserved</p>
  </footer>

  <script>
    const rentBtn = document.getElementById('rentBtn');
    const rentForm = document.getElementById('rentForm');
    const closeForm = document.getElementById('closeForm');
    const overlay = document.getElementById('overlay');

    rentBtn.addEventListener('click', () => {
      rentForm.style.display = 'block';
      overlay.style.display = 'block';
    });

    closeForm.addEventListener('click', () => {
      rentForm.style.display = 'none';
      overlay.style.display = 'none';
    });

    overlay.addEventListener('click', () => {
      rentForm.style.display = 'none';
      overlay.style.display = 'none';
    });
  </script>
</body>
</html>
